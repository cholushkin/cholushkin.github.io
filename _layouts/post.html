---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>

    <p class="post-meta">
      <small>
        {{ page.date | date: "%Y-%m-%d" }} —
        {% for category in page.categories %}
          <a href="{{ site.baseurl }}/{{ category }}/">#{{ category }}</a>
        {% endfor %}
      </small>
    </p>
  </header>

  <hr>

  {{ content }}
</article>
