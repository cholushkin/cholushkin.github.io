<!--
  Renders one post as a card. Expects a `post` variable in scope (works from
  a loop over posts, since Jekyll includes share the parent's local scope).

  This is NOT wrapped in one big <a> around everything: post.excerpt is
  rendered markdown and may itself contain real links. Nesting <a> inside
  <a> is invalid HTML - browsers "recover" from it by splitting the element
  into separate boxes, which breaks card layout (and breaks the inner link).
  So only the title and "Read post" affordance are actual links; the
  excerpt renders as plain markdown with working links of its own.
-->
<article class="card post-card">
  <div class="post-card-body">
    <h3><a class="post-card-title" href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
    <small class="post-date">{{ post.date | date: "%Y-%m-%d" }}</small>
    <div class="card-excerpt">
      {{ post.excerpt }}
    </div>
  </div>
  <div class="card-footer">
    <a class="card-cta card-cta-link" href="{{ post.url | relative_url }}">Read post →</a>
    <div class="card-tags">
      {% for category in post.categories %}#{{ category }} {% endfor %}
    </div>
  </div>
</article>
