title: Blog
description: "Gameplay dev experiments, snapshots, sandbox & cheatsheets"
baseurl: ""
url: "https://cholushkin.github.io"

markdown: kramdown
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-paginate

paginate: 10
paginate_path: "/page:num/"

# NOTE: this REPLACES Jekyll's built-in exclude defaults (they don't merge),
# so the usual defaults are repeated here - dropping vendor/bundle would make
# Jekyll try to build the Jekyll gem's own bundled files as site content.
exclude:
  - Gemfile
  - Gemfile.lock
  - readme.md
  - node_modules
  - vendor
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Site-wide content configuration.
# Filters are NOT hardcoded in HTML/JS - they are driven from here so the
# feed's filter links and the set of category archive pages always match.
blog:
  # Each entry becomes a filter link (see _includes/filters.html) AND a
  # static archive page (see thoughts.md / projects.md / articles.md).
  # To add a category: 1) add its slug here, 2) create a matching archive
  # stub page with `layout: category` and `category: <slug>`.
  filters:
    - thoughts
    - projects
    - articles
