<h1>🖼️ Snapshots</h1>

<div id="snapshot-grid"></div>

<button id="loadMoreBtn">Load older</button>

<div id="viewer" class="viewer hidden">
  <div class="viewer-backdrop"></div>

  <div class="viewer-content">

    <button id="closeViewer" class="viewer-close">✕</button>

    <button id="viewerPrev" class="viewer-arrow left"></button>
    <button id="viewerNext" class="viewer-arrow right"></button>

    <img id="viewerImage" src="">

    <div id="viewerText" class="viewer-text"></div>
  </div>
</div>

<style>

#snapshot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.snapshot-card {
  border: 1px solid #eee;
  padding: 16px;
  border-radius: 10px;
  background: white;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.snapshot-images {
  width: 100%;
  aspect-ratio: 5 / 3;

  position: relative;

  background: #f0f0f0;

  border-radius: 6px;

  margin-bottom: 10px;

  overflow: hidden;
}

.snapshot-arrow {
  position: absolute;

  top: 50%;
  transform: translateY(-50%);

  width: 34px;
  height: 34px;

  border: none;
  border-radius: 999px;

  background: rgba(0,0,0,0.45);

  cursor: pointer;

  z-index: 6;

  opacity: 0;

  transition: opacity 0.15s;

  backdrop-filter: blur(4px);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
}

.snapshot-images:hover .snapshot-arrow {
  opacity: 1;
}

.snapshot-arrow.left {
  left: 10px;
}

.snapshot-arrow.right {
  right: 10px;
}

.arrow-svg {
  width: 18px;
  height: 18px;

  stroke: white;
  stroke-width: 2.6;

  fill: none;

  stroke-linecap: round;
  stroke-linejoin: round;

  display: block;
}

.snapshot-slide {
  position: absolute;
  inset: 0;

  opacity: 0;
  pointer-events: none;

  transition: opacity 0.2s;
}

.snapshot-slide.active {
  opacity: 1;
  pointer-events: auto;
}

.snapshot-slide img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #f0f0f0;

  display: block;

  cursor: pointer;
}

.snapshot-dots {
  position: absolute;

  left: 50%;
  bottom: 10px;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 6px 10px;

  border-radius: 999px;

  background: rgba(0,0,0,0.35);

  backdrop-filter: blur(6px);

  z-index: 5;
}

.snapshot-dot {
  position: relative;

  width: 14px;
  height: 14px;

  border-radius: 999px;

  background: rgba(255,255,255,0.22);

  overflow: visible;

  cursor: pointer;

  flex-shrink: 0;
}

.snapshot-dot-fill {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 18px;
  height: 18px;

  margin-left: -9px;
  margin-top: -9px;

  border-radius: 999px;

  background: white;

  transform: scale(0);

  transform-origin: center center;

  will-change: transform;
}

.snapshot-text {
  font-size: 13px;
  color: #555;

  margin-top: 4px;

  line-height: 1.5;

  min-height: 40px;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

#loadMoreBtn {
  margin: 30px auto 0 auto;

  display: none;

  padding: 12px 18px;

  border-radius: 10px;
  border: 1px solid #ddd;

  background: white;
  cursor: pointer;
}

.viewer {
  position: fixed;
  inset: 0;

  z-index: 9999;
}

.viewer.hidden {
  display: none;
}

.viewer-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,0.92);
}

.viewer-content {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;
}

#viewerImage {
  max-width: 95%;
  max-height: 80vh;

  object-fit: contain;

  border-radius: 8px;
}

.viewer-text {
  margin-top: 18px;

  max-width: 900px;

  text-align: center;

  color: white;
  line-height: 1.5;
}

.viewer-close {
  position: absolute;

  top: 20px;
  right: 20px;

  background: rgba(255,255,255,0.1);

  border: none;
  color: white;

  width: 40px;
  height: 40px;

  border-radius: 999px;

  cursor: pointer;
  font-size: 18px;
}

.viewer-arrow {
  position: absolute;

  top: 50%;
  transform: translateY(-50%);

  width: 52px;
  height: 52px;

  border: none;
  border-radius: 999px;

  background: rgba(255,255,255,0.12);

  cursor: pointer;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
}

.viewer-arrow .arrow-svg {
  width: 24px;
  height: 24px;

  stroke-width: 2.4;
}

.viewer-arrow.left {
  left: 20px;
}

.viewer-arrow.right {
  right: 20px;
}

</style>

<script>

let snapshots = [];

const PAGE_SIZE = 20;
const MAX_VISIBLE = 120;

const AUTO_DURATION = 5000;

let currentIndex = 0;

let viewerImages = [];
let viewerSlide = 0;

const grid =
  document.getElementById("snapshot-grid");

const loadMoreBtn =
  document.getElementById("loadMoreBtn");

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");

const viewerText =
  document.getElementById("viewerText");

const closeViewer =
  document.getElementById("closeViewer");

function createLeftArrowSVG() {
  return `
  <svg viewBox="0 0 24 24" class="arrow-svg">
    <path d="M14 6 L8 12 L14 18" />
  </svg>
  `;
}

function createRightArrowSVG() {
  return `
  <svg viewBox="0 0 24 24" class="arrow-svg">
    <path d="M10 6 L16 12 L10 18" />
  </svg>
  `;
}

async function loadSnapshots() {

  const response = await fetch(
    "{{ site.baseurl }}/data/snapshots.json"
  );

  snapshots = await response.json();

  snapshots.sort(
    (a, b) => (b.priority || 0) - (a.priority || 0)
  );

  renderNextPage();
}

function renderNextPage() {

  const next = snapshots.slice(
    currentIndex,
    currentIndex + PAGE_SIZE
  );

  next.forEach(entry => {
    grid.appendChild(createCard(entry));
  });

  currentIndex += PAGE_SIZE;

  cleanupOldCards();

  if (currentIndex >= snapshots.length) {
    loadMoreBtn.style.display = "none";
  }
}

function cleanupOldCards() {

  const cards =
    grid.querySelectorAll(".snapshot-card");

  if (cards.length <= MAX_VISIBLE) return;

  const removeCount =
    cards.length - MAX_VISIBLE;

  for (let i = 0; i < removeCount; i++) {
    cards[i].remove();
  }
}

function createCard(entry) {

  const card =
    document.createElement("div");

  card.className = "snapshot-card";

  const imageWrap =
    document.createElement("div");

  imageWrap.className =
    "snapshot-images";

  let currentSlide = 0;

  const images =
    entry.images && entry.images.length
      ? entry.images
      : ["__default__"];

  const slides = [];
  const fills = [];

  let rafId;
  let startTime;

  function setSlide(index) {

    currentSlide =
      (index + images.length) % images.length;

    slides.forEach(s =>
      s.classList.remove("active")
    );

    slides[currentSlide]
      .classList.add("active");

    fills.forEach((fill, i) => {

      fill.style.transform =
        i === currentSlide
          ? "scale(1)"
          : "scale(0)";
    });
  }

  function animateDots(timestamp) {

    if (!startTime) {
      startTime = timestamp;
    }

    const elapsed =
      timestamp - startTime;

    let progress =
      elapsed / AUTO_DURATION;

    if (progress > 1) {
      progress = 1;
    }

    const nextSlide =
      (currentSlide + 1) % images.length;

    fills.forEach((fill, i) => {

      let scale = 0;

      if (i === currentSlide) {
        scale = 1 - progress;
      }

      if (i === nextSlide) {
        scale = progress;
      }

      fill.style.transform =
        `scale(${scale})`;
    });

    if (progress >= 1) {

      setSlide(nextSlide);

      startTime = timestamp;
    }

    rafId =
      requestAnimationFrame(animateDots);
  }

  function restartAnimation() {

    cancelAnimationFrame(rafId);

    startTime = null;

    rafId =
      requestAnimationFrame(animateDots);
  }

  images.forEach((imageName, index) => {

    const slide =
      document.createElement("div");

    slide.className = "snapshot-slide";

    if (index === 0) {
      slide.classList.add("active");
    }

    slides.push(slide);

    const img =
      document.createElement("img");

    if (imageName === "__default__") {

      img.src =
        "{{ site.baseurl }}/assets/default-thumb.webp";

    } else {

      const thumbName = imageName
        .replace(".jpg", ".webp")
        .replace(".png", ".webp");

      img.src =
        `{{ site.baseurl }}/assets/snapshots/thumbs/${thumbName}`;
    }

    img.onerror = () => {
      img.src =
        "{{ site.baseurl }}/assets/default-thumb.webp";
    };

    img.loading = "lazy";

    img.onclick = () => {

      if (imageName === "__default__") {
        return;
      }

      openViewer(images, currentSlide, entry.text);
    };

    slide.appendChild(img);

    imageWrap.appendChild(slide);
  });

  if (images.length > 1) {

    const leftBtn =
      document.createElement("button");

    leftBtn.className =
      "snapshot-arrow left";

    leftBtn.innerHTML =
      createLeftArrowSVG();

    leftBtn.onclick = e => {

      e.stopPropagation();

      setSlide(currentSlide - 1);

      restartAnimation();
    };

    const rightBtn =
      document.createElement("button");

    rightBtn.className =
      "snapshot-arrow right";

    rightBtn.innerHTML =
      createRightArrowSVG();

    rightBtn.onclick = e => {

      e.stopPropagation();

      setSlide(currentSlide + 1);

      restartAnimation();
    };

    imageWrap.appendChild(leftBtn);
    imageWrap.appendChild(rightBtn);

    const dots =
      document.createElement("div");

    dots.className = "snapshot-dots";

    images.forEach((_, index) => {

      const dot =
        document.createElement("div");

      dot.className = "snapshot-dot";

      const fill =
        document.createElement("div");

      fill.className =
        "snapshot-dot-fill";

      if (index === 0) {
        fill.style.transform = "scale(1)";
      }

      fills.push(fill);

      dot.appendChild(fill);

      dot.onclick = () => {

        setSlide(index);

        restartAnimation();
      };

      dots.appendChild(dot);
    });

    imageWrap.appendChild(dots);

    restartAnimation();
  }

  const text =
    document.createElement("div");

  text.className = "snapshot-text";
  text.innerText = entry.text || "";

  card.appendChild(imageWrap);
  card.appendChild(text);

  return card;
}

function openViewer(images, startIndex, text) {

  viewerImages = images;
  viewerSlide = startIndex;

  viewer.classList.remove("hidden");

  updateViewerImage();

  viewerText.innerText = text;

  document.body.style.overflow = "hidden";
}

function updateViewerImage() {

  const imageName =
    viewerImages[viewerSlide];

  viewerImage.src =
    `{{ site.baseurl }}/assets/snapshots/full/${imageName}`;
}

function viewerNext() {

  viewerSlide =
    (viewerSlide + 1) %
    viewerImages.length;

  updateViewerImage();
}

function viewerPrev() {

  viewerSlide =
    (viewerSlide - 1 + viewerImages.length) %
    viewerImages.length;

  updateViewerImage();
}

document.getElementById("viewerNext")
  .innerHTML = createRightArrowSVG();

document.getElementById("viewerPrev")
  .innerHTML = createLeftArrowSVG();

document.getElementById("viewerNext")
  .onclick = viewerNext;

document.getElementById("viewerPrev")
  .onclick = viewerPrev;

function closeViewerFn() {

  viewer.classList.add("hidden");

  viewerImage.src = "";

  document.body.style.overflow = "";
}

closeViewer.onclick = closeViewerFn;

viewer.onclick = e => {

  if (
    e.target.classList.contains(
      "viewer-backdrop"
    )
  ) {
    closeViewerFn();
  }
};

window.addEventListener("keydown", e => {

  if (!viewer.classList.contains("hidden")) {

    if (e.key === "ArrowRight") {
      viewerNext();
    }

    if (e.key === "ArrowLeft") {
      viewerPrev();
    }
  }

  if (e.key === "Escape") {
    closeViewerFn();
  }
});

loadMoreBtn.onclick = renderNextPage;

loadSnapshots();

</script>
