layout: default
title: Snapshots
permalink: /snapshots/
---

<h1>🖼️ Snapshots</h1>

<div id="snapshot-grid"></div>

<button id="loadMoreBtn">Load older</button>

<div id="viewer" class="viewer hidden">
  <div class="viewer-backdrop"></div>

  <div class="viewer-content">
    <button id="closeViewer" class="viewer-close">✕</button>

    <img id="viewerImage" src="">

    <div id="viewerText" class="viewer-text"></div>
  </div>
</div>

<style>
.container {
  max-width: 1400px !important;
}

* {
  box-sizing: border-box;
}

#snapshot-grid {
  display: grid;

  grid-template-columns: repeat(
    auto-fill,
    minmax(320px, 1fr)
  );

  gap: 18px;
}

.snapshot-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #e8e8e8;
}

.snapshot-images {
  width: 100%;
  height: 240px;

  display: grid;
  gap: 2px;

  background: #ddd;
  overflow: hidden;
}

.snapshot-images.count-1 {
  grid-template-columns: 1fr;
}

.snapshot-images.count-2 {
  grid-template-columns: 1fr 1fr;
}

.snapshot-images.count-3,
.snapshot-images.count-4,
.snapshot-images.count-5,
.snapshot-images.count-6 {
  grid-template-columns: repeat(3, 1fr);
}

.snapshot-images img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #f0f0f0;
  display: block;
  cursor: pointer;
}

.snapshot-text {
  padding: 12px;

  font-size: 14px;
  line-height: 1.4;
  color: #333;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;

  overflow: hidden;

  min-height: 58px;
}

#loadMoreBtn {
  margin: 30px auto;

  display: block;

  padding: 12px 18px;

  border-radius: 10px;
  border: 1px solid #ddd;

  background: white;
  cursor: pointer;
}

.viewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
}

.viewer.hidden {
  display: none;
}

.viewer-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,0.92);
}

.viewer-content {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;
}

#viewerImage {
  max-width: 95%;
  max-height: 80vh;

  object-fit: contain;

  border-radius: 8px;
}

.viewer-text {
  margin-top: 18px;

  max-width: 900px;

  text-align: center;

  color: white;
  line-height: 1.5;
}

.viewer-close {
  position: absolute;

  top: 20px;
  right: 20px;

  background: rgba(255,255,255,0.1);

  border: none;
  color: white;

  width: 40px;
  height: 40px;

  border-radius: 999px;

  cursor: pointer;
  font-size: 18px;
}
</style>

<script>
let snapshots = [];

const PAGE_SIZE = 20;
const MAX_VISIBLE = 120;

let currentIndex = 0;

const grid = document.getElementById("snapshot-grid");

const loadMoreBtn =
  document.getElementById("loadMoreBtn");

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");

const viewerText =
  document.getElementById("viewerText");

const closeViewer =
  document.getElementById("closeViewer");

async function loadSnapshots() {

  const response = await fetch(
    "{{ site.baseurl }}/data/snapshots.json"
  );

  snapshots = await response.json();

  renderNextPage();
}

function renderNextPage() {

  const next = snapshots.slice(
    currentIndex,
    currentIndex + PAGE_SIZE
  );

  next.forEach(entry => {
    grid.appendChild(createCard(entry));
  });

  currentIndex += PAGE_SIZE;

  cleanupOldCards();

  if (currentIndex >= snapshots.length) {
    loadMoreBtn.style.display = "none";
  }
}

function cleanupOldCards() {

  const cards =
    grid.querySelectorAll(".snapshot-card");

  if (cards.length <= MAX_VISIBLE) return;

  const removeCount =
    cards.length - MAX_VISIBLE;

  for (let i = 0; i < removeCount; i++) {
    cards[i].remove();
  }
}

function createCard(entry) {

  const card = document.createElement("div");

  card.className = "snapshot-card";

  const imageWrap =
    document.createElement("div");

  imageWrap.className =
    `snapshot-images count-${entry.images.length}`;

  entry.images.forEach(imageName => {

    const img = document.createElement("img");

    const thumbName = imageName
      .replace(".jpg", ".webp")
      .replace(".png", ".webp");

    img.src =
      `{{ site.baseurl }}/assets/snapshots/thumbs/${thumbName}`;

    img.onerror = () => {
      img.src =
        "{{ site.baseurl }}/assets/default-thumb.webp";
    };

    img.loading = "lazy";

    img.onclick = () => {
      openViewer(imageName, entry.text);
    };

    imageWrap.appendChild(img);
  });

  const text = document.createElement("div");

  text.className = "snapshot-text";
  text.innerText = entry.text;

  card.appendChild(imageWrap);
  card.appendChild(text);

  return card;
}

function openViewer(imageName, text) {

  viewer.classList.remove("hidden");

  viewerImage.src =
    `{{ site.baseurl }}/assets/snapshots/full/${imageName}`;

  viewerText.innerText = text;

  document.body.style.overflow = "hidden";
}

function closeViewerFn() {

  viewer.classList.add("hidden");

  viewerImage.src = "";

  document.body.style.overflow = "";
}

closeViewer.onclick = closeViewerFn;

viewer.onclick = e => {

  if (
    e.target.classList.contains(
      "viewer-backdrop"
    )
  ) {
    closeViewerFn();
  }
};

window.addEventListener("keydown", e => {

  if (e.key === "Escape") {
    closeViewerFn();
  }
});

loadMoreBtn.onclick = renderNextPage;

loadSnapshots();
</script>
