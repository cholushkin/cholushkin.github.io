---
layout: default
title: Snapshots
permalink: /snapshots/
---

<h1>🖼️ Snapshots</h1>

<div id="snapshot-grid"></div>

<button id="loadMoreBtn">Load older</button>

<div id="viewer" class="viewer hidden">
  <div class="viewer-backdrop"></div>

  <div class="viewer-content">
    <button id="closeViewer" class="viewer-close">✕</button>

    <img id="viewerImage" src="">

    <div id="viewerText" class="viewer-text"></div>
  </div>
</div>

<style>
.container {
  max-width: 1200px !important;
  margin: 40px auto !important;
}

* {
  box-sizing: border-box;
}

#snapshot-grid {
  display: grid;

  grid-template-columns: repeat(
    auto-fit,
    320px
  );

  justify-content: center;

  gap: 18px;
}

.snapshot-card {
  width: 320px;

  background: white;

  border-radius: 10px;

  overflow: hidden;

  cursor: default;

  display: flex;
  flex-direction: column;
}

.snapshot-images {
  width: 100%;
  height: 240px;

  position: relative;

  background: #f0f0f0;
  overflow: hidden;
}

.snapshot-slide {
  position: absolute;
  inset: 0;

  opacity: 0;
  pointer-events: none;

  transition: opacity 0.2s;
}

.snapshot-slide.active {
  opacity: 1;
  pointer-events: auto;
}

.snapshot-slide img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;
  cursor: pointer;

  background: #f0f0f0;
}

.snapshot-dots {
  position: absolute;

  left: 50%;
  bottom: 10px;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 6px 10px;

  border-radius: 999px;

  background: rgba(0,0,0,0.35);

  backdrop-filter: blur(6px);

  z-index: 5;
}

.snapshot-dot {
  width: 14px;
  height: 14px;

  border-radius: 999px;

  background: rgba(255,255,255,0.45);

  border: 1px solid rgba(255,255,255,0.2);

  cursor: pointer;

  transition: all 0.15s;
}

.snapshot-dot.active {
  background: white;
  transform: scale(1.15);
}

.snapshot-text {
  padding: 14px;

  font-size: 13px;
  line-height: 1.5;

  color: #555;

  min-height: 72px;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;

  overflow: hidden;
}

#loadMoreBtn {
  margin: 30px auto;

  display: block;

  padding: 12px 18px;

  border-radius: 10px;
  border: 1px solid #ddd;

  background: white;
  cursor: pointer;
}

.viewer {
  position: fixed;
  inset: 0;

  z-index: 9999;
}

.viewer.hidden {
  display: none;
}

.viewer-backdrop {
  position: absolute;
  inset: 0;

  background: rgba(0,0,0,0.92);
}

.viewer-content {
  position: relative;
  z-index: 2;

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;
}

#viewerImage {
  max-width: 95%;
  max-height: 80vh;

  object-fit: contain;

  border-radius: 8px;
}

.viewer-text {
  margin-top: 18px;

  max-width: 900px;

  text-align: center;

  color: white;
  line-height: 1.5;
}

.viewer-close {
  position: absolute;

  top: 20px;
  right: 20px;

  background: rgba(255,255,255,0.1);

  border: none;
  color: white;

  width: 40px;
  height: 40px;

  border-radius: 999px;

  cursor: pointer;
  font-size: 18px;
}
</style>

<script>
let snapshots = [];

const PAGE_SIZE = 20;
const MAX_VISIBLE = 120;

let currentIndex = 0;

const grid =
  document.getElementById("snapshot-grid");

const loadMoreBtn =
  document.getElementById("loadMoreBtn");

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");

const viewerText =
  document.getElementById("viewerText");

const closeViewer =
  document.getElementById("closeViewer");

async function loadSnapshots() {

  const response = await fetch(
    "{{ site.baseurl }}/data/snapshots.json"
  );

  snapshots = await response.json();

  renderNextPage();
}

function renderNextPage() {

  const next = snapshots.slice(
    currentIndex,
    currentIndex + PAGE_SIZE
  );

  next.forEach(entry => {
    grid.appendChild(createCard(entry));
  });

  currentIndex += PAGE_SIZE;

  cleanupOldCards();

  if (currentIndex >= snapshots.length) {
    loadMoreBtn.style.display = "none";
  }
}

function cleanupOldCards() {

  const cards =
    grid.querySelectorAll(".snapshot-card");

  if (cards.length <= MAX_VISIBLE) return;

  const removeCount =
    cards.length - MAX_VISIBLE;

  for (let i = 0; i < removeCount; i++) {
    cards[i].remove();
  }
}

function createCard(entry) {

  const card =
    document.createElement("div");

  card.className = "snapshot-card";

  const imageWrap =
    document.createElement("div");

  imageWrap.className =
    "snapshot-images";

  let currentSlide = 0;

  entry.images.forEach((imageName, index) => {

    const slide =
      document.createElement("div");

    slide.className = "snapshot-slide";

    if (index === 0) {
      slide.classList.add("active");
    }

    const img =
      document.createElement("img");

    const thumbName = imageName
      .replace(".jpg", ".webp")
      .replace(".png", ".webp");

    img.src =
      `{{ site.baseurl }}/assets/snapshots/thumbs/${thumbName}`;

    img.onerror = () => {
      img.src =
        "{{ site.baseurl }}/assets/default-thumb.webp";
    };

    img.loading = "lazy";

    img.onclick = () => {
      openViewer(imageName, entry.text);
    };

    slide.appendChild(img);

    imageWrap.appendChild(slide);
  });

  if (entry.images.length > 1) {

    const dots =
      document.createElement("div");

    dots.className = "snapshot-dots";

    entry.images.forEach((_, index) => {

      const dot =
        document.createElement("div");

      dot.className = "snapshot-dot";

      if (index === 0) {
        dot.classList.add("active");
      }

      dot.onclick = () => {

        currentSlide = index;

        const slides =
          imageWrap.querySelectorAll(
            ".snapshot-slide"
          );

        const allDots =
          dots.querySelectorAll(
            ".snapshot-dot"
          );

        slides.forEach(s =>
          s.classList.remove("active")
        );

        allDots.forEach(d =>
          d.classList.remove("active")
        );

        slides[currentSlide]
          .classList.add("active");

        allDots[currentSlide]
          .classList.add("active");
      };

      dots.appendChild(dot);
    });

    imageWrap.appendChild(dots);
  }

  const text =
    document.createElement("div");

  text.className = "snapshot-text";
  text.innerText = entry.text;

  card.appendChild(imageWrap);
  card.appendChild(text);

  return card;
}

function openViewer(imageName, text) {

  viewer.classList.remove("hidden");

  viewerImage.src =
    `{{ site.baseurl }}/assets/snapshots/full/${imageName}`;

  viewerText.innerText = text;

  document.body.style.overflow = "hidden";
}

function closeViewerFn() {

  viewer.classList.add("hidden");

  viewerImage.src = "";

  document.body.style.overflow = "";
}

closeViewer.onclick = closeViewerFn;

viewer.onclick = e => {

  if (
    e.target.classList.contains(
      "viewer-backdrop"
    )
  ) {
    closeViewerFn();
  }
};

window.addEventListener("keydown", e => {

  if (e.key === "Escape") {
    closeViewerFn();
  }
});

loadMoreBtn.onclick = renderNextPage;

loadSnapshots();
</script>
